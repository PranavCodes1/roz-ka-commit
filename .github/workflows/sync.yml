# Automatic GitHub → Supabase sync for Roz Ka Commit.
#
# Runs scripts/sync.js (the same logic as the admin page's "Refresh all from GitHub").
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL                https://<project-ref>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY   a Supabase *secret* key (sb_secret_…) — server-side only
# The secret key lives in GitHub's encrypted secret store; it is never part of the website.
name: Sync GitHub activity

on:
  schedule:
    # Every hour at :17 (GitHub cron is UTC; :17 avoids the busy top of the hour).
    # 18:17 UTC = 23:47 IST, so each India day gets a final sync just before it ends.
    # Commits pushed after that are still caught later (each sync re-checks 14 days).
    # Free: Actions minutes are unlimited for public repositories (~30 s per run).
    - cron: '17 * * * *'
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions:
  contents: read

concurrency: # never run two syncs at once
  group: rkc-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check settings
        env:
          SECRET_URL: ${{ secrets.SUPABASE_URL }}
          SECRET_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAR_URL: ${{ vars.SUPABASE_URL }}
          VAR_KEY_SET: ${{ vars.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: |
          ok=1
          if [ -z "$SECRET_URL" ] && [ -z "$VAR_URL" ]; then
            echo "::error title=SUPABASE_URL missing::No repository secret or variable named SUPABASE_URL is visible to this workflow. Add it under Settings → Secrets and variables → Actions (not Environments, Codespaces or Dependabot), spelled exactly SUPABASE_URL."
            ok=0
          fi
          if [ -z "$SECRET_KEY" ]; then
            if [ "$VAR_KEY_SET" = "true" ]; then
              echo "::error title=Key saved as a Variable::SUPABASE_SERVICE_ROLE_KEY was added on the Variables tab, where it is stored in plain text. Delete that variable, create a new secret key in Supabase (and delete the exposed one), then add it on the Secrets tab."
            else
              echo "::error title=SUPABASE_SERVICE_ROLE_KEY missing::No repository secret named SUPABASE_SERVICE_ROLE_KEY is visible to this workflow. Add it on the Secrets tab under Settings → Secrets and variables → Actions (not Environments, Codespaces or Dependabot), spelled exactly SUPABASE_SERVICE_ROLE_KEY."
            fi
            ok=0
          fi
          [ "$ok" = 1 ] || exit 1
          echo "Settings found."

      - name: Sync contributors from GitHub
        env:
          # The project URL is not sensitive, so it may be a secret or a plain variable.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ github.token }} # raises the GitHub search limit to 30 requests/min
        run: |
          set +e
          node scripts/sync.js 2>&1 | tee sync.log
          status=${PIPESTATUS[0]}
          { echo '### Roz Ka Commit sync'; echo '```'; grep -v '^::' sync.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
