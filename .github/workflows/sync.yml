# OPTIONAL scheduled sync. The admin "Refresh" button works without this.
# Enable by adding repository secrets SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY
# (Settings → Secrets and variables → Actions). The service key stays in GitHub's
# secret store and is never part of the website.
name: Sync GitHub activity

on:
  schedule:
    - cron: '0 18 * * *'   # 18:00 UTC = 23:30 IST, before the day ends in India
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Secrets not configured; skipping scheduled sync."; exit 0
          fi
          node scripts/sync.js
